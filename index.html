<title>考研修行 · 登仙录</title>
<style>
  :root{
    --bg:#12100c;
    --bg2:#1a1711;
    --bg3:#221e15;
    --line:rgba(201,162,39,.16);
    --gold:#c9a227;
    --gold2:#e8c766;
    --gold-dim:rgba(201,162,39,.14);
    --text:#eae2cc;
    --muted:#93886f;
    --dim:#6e6754;
    --danger:#c25b45;
    --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
    --sans:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(1100px 480px at 50% -160px, rgba(201,162,39,.12), transparent 60%),
      radial-gradient(900px 700px at 50% 120%, rgba(90,60,20,.08), transparent 60%);
  }
  .wrap{ position:relative; z-index:1; max-width:520px; margin:0 auto; padding:0 16px calc(84px + env(safe-area-inset-bottom)); }

  /* ---------- header ---------- */
  header.top{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 0 10px;
  }
  .brand{ font-family:var(--serif); font-size:15px; color:var(--muted); letter-spacing:.28em; }
  .brand b{ color:var(--gold); font-weight:600; }
  .streak-chip{
    display:flex; align-items:center; gap:5px;
    background:var(--gold-dim); border:1px solid var(--line);
    color:var(--gold2); border-radius:999px; padding:4px 11px; font-size:12.5px;
  }

  /* ---------- hero / 道心盘 ---------- */
  .hero{ display:flex; flex-direction:column; align-items:center; padding:8px 0 4px; }
  .ringbox{ position:relative; width:min(70vw,268px); aspect-ratio:1; }
  .ringbox svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:rgba(201,162,39,.10); stroke-width:9; }
  .ring-fg{ fill:none; stroke:url(#goldGrad); stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset .9s cubic-bezier(.22,1,.36,1); }
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  }
  .realm{ font-family:var(--serif); font-size:17px; color:var(--gold); letter-spacing:.14em; }
  .realm .stage{ font-size:12px; color:var(--muted); letter-spacing:.1em; margin-left:4px; }
  .lvl{ font-family:var(--serif); font-size:clamp(60px,19vw,86px); line-height:1; font-weight:700;
    background:linear-gradient(180deg,#f3e2a4 0%, var(--gold) 55%, #8c6e1f 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; margin:6px 0 2px; }
  .lvl-sub{ font-size:12px; color:var(--muted); letter-spacing:.06em; }
  .lvl-sub b{ color:var(--text); font-weight:600; }

  /* ---------- daily goal ---------- */
  .goal{ margin-top:16px; background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  .goal-row{ display:flex; align-items:baseline; justify-content:space-between; font-size:13px; color:var(--muted); }
  .goal-row .num{ font-family:var(--serif); font-size:18px; color:var(--gold2); font-weight:600; }
  .goal-row .done{ color:#63a57e; font-weight:600; }
  .bar{ height:7px; background:rgba(201,162,39,.10); border-radius:99px; margin-top:9px; overflow:hidden; }
  .bar > i{ display:block; height:100%; border-radius:99px;
    background:linear-gradient(90deg,#8c6e1f,var(--gold),var(--gold2));
    transition:width .7s cubic-bezier(.22,1,.36,1); }

  /* ---------- subjects ---------- */
  .sec-label{ margin:22px 0 10px; font-size:12px; color:var(--dim); letter-spacing:.22em; }
  .subj{ background:var(--bg2); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; position:relative; overflow:hidden; }
  .subj::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--sc); opacity:.85; }
  .subj-head{ display:flex; align-items:center; gap:9px; }
  .subj-dot{ width:9px; height:9px; border-radius:50%; background:var(--sc); box-shadow:0 0 10px var(--sc); }
  .subj-name{ font-family:var(--serif); font-size:17px; font-weight:600; }
  .subj-dao{ font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 7px; letter-spacing:.1em; }
  .subj-score{ margin-left:auto; font-size:13px; color:var(--muted); }
  .subj-score b{ font-family:var(--serif); font-size:19px; color:var(--text); font-weight:600; }
  .subj-bar{ height:6px; background:rgba(255,255,255,.06); border-radius:99px; margin:11px 0 13px; overflow:hidden; }
  .subj-bar > i{ display:block; height:100%; border-radius:99px; background:var(--sc); opacity:.9; transition:width .7s cubic-bezier(.22,1,.36,1); }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1px solid var(--line); background:var(--bg3); color:var(--text);
    border-radius:10px; padding:9px 12px; font-size:13.5px; cursor:pointer; position:relative;
    transition:transform .08s ease, border-color .15s ease, background .15s ease;
    -webkit-user-select:none; user-select:none;
  }
  .chip:active{ transform:scale(.95); border-color:var(--gold); }
  .chip .xp{ color:var(--gold2); font-weight:600; margin-left:5px; }
  .chip.custom{ color:var(--muted); border-style:dashed; }
  .float-xp{ position:fixed; z-index:60; pointer-events:none; font-family:var(--serif); font-weight:700; color:var(--gold2);
    font-size:16px; text-shadow:0 0 8px rgba(201,162,39,.6); animation:floatUp .8s ease forwards; }
  @keyframes floatUp{ 0%{opacity:1; transform:translate(-50%,0);} 100%{opacity:0; transform:translate(-50%,-36px);} }

  /* ---------- history ---------- */
  .day{ margin-bottom:18px; }
  .day-head{ display:flex; align-items:baseline; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-bottom:8px; }
  .day-head b{ font-family:var(--serif); font-size:15px; color:var(--text); font-weight:600; }
  .day-total{ color:var(--gold2); }
  .log-item{ display:flex; align-items:center; gap:10px; background:var(--bg2); border:1px solid var(--line);
    border-radius:11px; padding:10px 12px; margin-bottom:7px; }
  .log-dot{ width:8px; height:8px; border-radius:50%; background:var(--sc); flex:none; }
  .log-label{ flex:1; font-size:14px; }
  .log-xp{ font-size:13px; color:var(--gold2); font-weight:600; }
  .log-del{ border:none; background:none; color:var(--dim); font-size:16px; cursor:pointer; padding:2px 6px; }
  .log-del:active{ color:var(--danger); }
  .empty{ text-align:center; color:var(--dim); padding:40px 20px; font-size:14px; }
  .empty .big{ font-family:var(--serif); font-size:34px; color:var(--gold-dim); margin-bottom:8px; }

  /* ---------- settings ---------- */
  .set-block{ background:var(--bg2); border:1px solid var(--line); border-radius:16px; padding:15px 14px; margin-bottom:12px; }
  .set-title{ font-family:var(--serif); font-size:15px; font-weight:600; margin-bottom:4px; }
  .set-hint{ font-size:12px; color:var(--dim); margin-bottom:12px; }
  .field{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px solid rgba(255,255,255,.04); }
  .field:first-of-type{ border-top:none; }
  .field label{ font-size:13.5px; color:var(--muted); }
  .field input[type=number]{ width:74px; background:var(--bg3); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:6px 9px; font-size:14px; text-align:center; }
  .field input[type=range]{ width:130px; accent-color:var(--gold); }
  .field .val{ font-size:13px; color:var(--gold2); font-weight:600; min-width:44px; text-align:right; }
  .act-row{ display:flex; gap:8px; margin-top:8px; align-items:center; }
  .act-row input{ background:var(--bg3); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 9px; font-size:13.5px; }
  .act-row .act-label{ flex:1; }
  .act-row .act-xp{ width:72px; text-align:center; }
  .act-del{ border:none; background:none; color:var(--dim); font-size:17px; cursor:pointer; padding:4px 6px; }
  .act-del:active{ color:var(--danger); }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line);
    background:var(--bg3); color:var(--text); border-radius:10px; padding:10px 14px; font-size:14px; cursor:pointer; width:100%; margin-top:10px; }
  .btn:active{ border-color:var(--gold); }
  .btn.gold{ background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#241d08; font-weight:600; border:none; }
  .btn.danger{ color:var(--danger); }

  /* ---------- tabbar ---------- */
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:rgba(18,16,12,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--muted); padding:10px 0 12px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px;
  }
  nav.tabbar button.active{ color:var(--gold2); }
  nav.tabbar svg{ width:22px; height:22px; }

  /* ---------- modal / toast / levelup ---------- */
  .overlay{ position:fixed; inset:0; z-index:50; background:rgba(8,7,5,.72); display:none; align-items:center; justify-content:center; padding:24px; }
  .overlay.show{ display:flex; }
  .modal{ background:var(--bg2); border:1px solid var(--line); border-radius:18px; padding:20px; width:100%; max-width:340px; }
  .modal h3{ margin:0 0 4px; font-family:var(--serif); font-size:18px; font-weight:600; }
  .modal .sub{ font-size:12.5px; color:var(--muted); margin-bottom:14px; }
  .modal input{ width:100%; background:var(--bg3); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:10px 12px; font-size:15px; margin-bottom:10px; }
  .quick{ display:flex; gap:8px; margin:4px 0 14px; }
  .quick button{ flex:1; background:var(--bg3); border:1px solid var(--line); color:var(--gold2); border-radius:9px; padding:8px 0; font-size:14px; cursor:pointer; }
  .quick button:active{ border-color:var(--gold); }

  #toast{ position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
    background:var(--bg3); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:10px 16px;
    font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:70; max-width:82vw; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  #levelup{ position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center; }
  #levelup.show{ display:flex; }
  #levelup .flash{ position:absolute; inset:0; background:radial-gradient(600px 600px at 50% 50%, rgba(232,199,102,.5), transparent 70%); opacity:0; animation:flash 1.5s ease forwards; }
  @keyframes flash{ 0%{opacity:0;} 25%{opacity:.9;} 100%{opacity:0;} }
  #levelup .box{ position:relative; text-align:center; animation:luPop 1.7s ease forwards; padding:30px; }
  @keyframes luPop{ 0%{opacity:0; transform:scale(.72);} 18%{opacity:1; transform:scale(1.04);} 30%{transform:scale(1);} 78%{opacity:1; transform:scale(1);} 100%{opacity:0; transform:scale(1.06);} }
  #levelup .eyebrow{ font-size:13px; color:var(--gold); letter-spacing:.3em; margin-bottom:10px; }
  #levelup .title{ font-family:var(--serif); font-size:clamp(30px,9vw,42px); font-weight:700; color:#f3e2a4; text-shadow:0 0 24px rgba(232,199,102,.55); }
  #levelup .sub{ margin-top:8px; font-size:15px; color:var(--gold2); }
  .particle{ position:absolute; left:50%; top:50%; width:7px; height:7px; border-radius:50%; background:radial-gradient(circle,#f3e2a4,var(--gold)); box-shadow:0 0 10px var(--gold); animation:particleFly var(--dur,1.2s) ease-out forwards; }
  @keyframes particleFly{ to{ transform:translate(var(--dx),var(--dy)) scale(0); opacity:0; } }

  @media (prefers-reduced-motion: reduce){
    .ring-fg,.bar > i,.subj-bar > i{ transition:none; }
    .float-xp,#levelup .flash,#levelup .box,.particle{ animation-duration:.01s; }
  }
</style>
</head>
<body>
<div class="wrap" id="view-xiulian">
  <header class="top">
    <div class="brand">考研修行 · <b>登仙录</b></div>
    <div class="streak-chip" id="streakChip">🔥 连续 0 天</div>
  </header>

  <div class="hero">
    <div class="ringbox">
      <svg viewBox="0 0 200 200">
        <defs>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8c6e1f"/>
            <stop offset=".55" stop-color="#c9a227"/>
            <stop offset="1" stop-color="#e8c766"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="100" cy="100" r="88"/>
        <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="88"/>
      </svg>
      <div class="ring-center">
        <div class="realm" id="realm">炼气期<span class="stage">· 初期</span></div>
        <div class="lvl" id="bigLevel">0</div>
        <div class="lvl-sub">总分 <b id="totalExact">0.0</b> / 500 级</div>
      </div>
    </div>
  </div>

  <div class="goal">
    <div class="goal-row">
      <span>今日修行 <span class="num" id="todayXp">0</span> 经验</span>
      <span id="goalState">目标 <b id="goalVal">4</b> / <span class="done" id="goalDone">未达标</span></span>
    </div>
    <div class="bar"><i id="goalBar" style="width:0%"></i></div>
  </div>

  <div class="sec-label">四科 · 道行</div>
  <div id="subjects"></div>
</div>

<div class="wrap" id="view-history" style="display:none">
  <header class="top"><div class="brand">修行 · <b>记录</b></div></header>
  <div id="historyList"></div>
</div>

<div class="wrap" id="view-settings" style="display:none">
  <header class="top"><div class="brand">修行 · <b>设定</b></div></header>

  <div class="set-block">
    <div class="set-title">每日目标</div>
    <div class="set-hint">当天累计经验达到目标即算「达标」，计入连续打卡。</div>
    <div class="field">
      <label>每日目标经验</label>
      <input type="number" id="setGoal" step="0.5" min="0.5" value="4">
    </div>
  </div>

  <div class="set-block">
    <div class="set-title">难度曲线</div>
    <div class="set-hint" id="curveHint">越接近 1 越接近线性；默认 0.5，前期升级快、后期慢。</div>
    <div class="field">
      <label>曲线系数</label>
      <input type="range" id="setCurve" min="0.3" max="1" step="0.05" value="0.5">
      <span class="val" id="curveVal">0.5</span>
    </div>
    <div class="set-hint" id="curveExample" style="margin:12px 0 0;"></div>
  </div>

  <div class="set-block">
    <div class="set-title">用进废退</div>
    <div class="set-hint" id="decayHint"></div>
    <div class="field">
      <label>开启衰退</label>
      <input type="checkbox" id="setDecayEnabled" style="width:20px;height:20px;accent-color:var(--gold)">
    </div>
    <div class="field"><label>每天退级（级）</label><input type="number" id="setDecayPerDay" step="0.5" min="0.1" value="1"></div>
    <div class="field"><label>最多连退（天，0=不限）</label><input type="number" id="setDecayCap" step="1" min="0" value="7"></div>
    <div class="field"><label>最低保留（级）</label><input type="number" id="setDecayFloor" step="0.5" min="0" value="0"></div>
    <div class="set-hint" id="decayLast" style="margin-top:10px;"></div>
  </div>

  <div class="set-block">
    <div class="set-title">各科满级所需经验</div>
    <div class="set-hint">数值越小、满级越快。改完即生效。</div>
    <div id="xpMaxFields"></div>
  </div>

  <div class="set-block">
    <div class="set-title">活动预设</div>
    <div class="set-hint">点一下即可积累经验的快捷入口。改完即生效。</div>
    <div id="actFields"></div>
  </div>

  <div class="set-block">
    <div class="set-title">数据</div>
    <div class="set-hint">数据存在本机浏览器。换手机或防丢失请定期「导出备份」，再到新设备「导入」。</div>
    <button class="btn gold" data-action="export">导出备份</button>
    <button class="btn" data-action="import">导入备份</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <button class="btn danger" data-action="reset">清空重置</button>
  </div>
</div>

<nav class="tabbar">
  <button class="active" data-action="tab" data-tab="xiulian">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/></svg>
    修行
  </button>
  <button data-action="tab" data-tab="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h12v18l-6-3.5L6 21z"/></svg>
    记录
  </button>
  <button data-action="tab" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8l1.2 2.6 2.8.4-.5 2.8 1.9 2.1-2.1 1.9-.4 2.8-2.8-.5-2.6 1.2-1.2-2.6-2.8-.4.5-2.8-1.9-2.1 2.1-1.9.4-2.8 2.8.5z"/></svg>
    设定
  </button>
</nav>

<!-- 自定义打卡弹窗 -->
<div class="overlay" id="customOverlay">
  <div class="modal">
    <h3 id="customTitle">自定义打卡</h3>
    <div class="sub" id="customSub">记录一次学习，折算为经验。</div>
    <input type="text" id="customLabel" placeholder="例如：刷了 3 道高数大题">
    <input type="number" id="customXp" step="0.05" min="0.05" placeholder="经验值，例如 0.5">
    <div class="quick" id="customQuick"></div>
    <button class="btn gold" id="customOk">确认积累</button>
    <button class="btn" id="customCancel">取消</button>
  </div>
</div>

<div id="toast"></div>

<div id="levelup">
  <div class="flash"></div>
  <div class="box">
    <div class="eyebrow" id="luEyebrow">等级提升</div>
    <div class="title" id="luTitle">Lv 0</div>
    <div class="sub" id="luSub"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= 常量 ================= */
var LS_KEY = "kaoyan-xiulian-v1";

var SUBJECTS = {
  math:    { name:"数学",   dao:"数道", maxLevel:150, color:"#5b93c8" },
  english: { name:"英语",   dao:"辞道", maxLevel:100, color:"#63a57e" },
  politics:{ name:"政治",   dao:"政道", maxLevel:100, color:"#c25b45" },
  major:   { name:"专业课", dao:"术道", maxLevel:150, color:"#c99a4a" }
};
var SUBJECT_KEYS = ["math","english","politics","major"];
var TOTAL_MAX = 500;

var REALMS = [
  {min:0,name:"炼气"},{min:50,name:"筑基"},{min:100,name:"金丹"},{min:150,name:"元婴"},
  {min:200,name:"化神"},{min:250,name:"炼虚"},{min:300,name:"合体"},{min:350,name:"大乘"},
  {min:400,name:"渡劫"},{min:450,name:"飞升"}
];

var DEFAULT_ACTIVITIES = {
  math:[
    {label:"做一套数学卷", xp:0.5},
    {label:"做半套数学卷", xp:0.25},
    {label:"精练一道大题", xp:0.15},
    {label:"复习一章", xp:0.3},
    {label:"订正一套错题", xp:0.2}
  ],
  english:[
    {label:"背100个单词", xp:1},
    {label:"背50个单词", xp:0.5},
    {label:"做一套英语卷", xp:0.5},
    {label:"精读一篇阅读", xp:0.25},
    {label:"练一篇作文", xp:0.3}
  ],
  politics:[
    {label:"做100道选择题", xp:1},
    {label:"做50道选择题", xp:0.5},
    {label:"背一章知识点", xp:0.5},
    {label:"背一套帽子题", xp:0.4},
    {label:"看一节网课", xp:0.3}
  ],
  major:[
    {label:"做一套专业课卷", xp:0.5},
    {label:"做半套专业课卷", xp:0.25},
    {label:"背一章专业课", xp:0.5},
    {label:"整理一章笔记", xp:0.3}
  ]
};

function defaultState(){
  return {
    xp:{ math:0, english:0, politics:0, major:0 },
    log:[],
    settings:{
      dailyGoal:4,
      curveK:0.5,
      xpMax:{ math:300, english:200, politics:200, major:300 },
      activities: JSON.parse(JSON.stringify(DEFAULT_ACTIVITIES)),
      decay:{ enabled:true, perDay:1, cap:7, floor:0 }
    },
    createdAt: Date.now(),
    decayRun: null,
    lastDecay: null
  };
}

/* ================= 状态 ================= */
var state = load();

function normalize(s){
  var d = defaultState();
  s = s || {};
  s.settings = s.settings || d.settings;
  s.settings.activities = s.settings.activities || {};
  s.settings.xpMax = s.settings.xpMax || {};
  SUBJECT_KEYS.forEach(function(k){
    if(!s.settings.activities[k] || !s.settings.activities[k].length) s.settings.activities[k] = JSON.parse(JSON.stringify(d.settings.activities[k]));
    if(!(k in s.settings.xpMax)) s.settings.xpMax[k] = d.settings.xpMax[k];
  });
  s.xp = s.xp || {};
  SUBJECT_KEYS.forEach(function(k){ if(typeof s.xp[k] !== "number") s.xp[k] = 0; });
  s.log = Array.isArray(s.log) ? s.log : [];
  if(typeof s.settings.curveK !== "number") s.settings.curveK = 0.5;
  if(typeof s.settings.dailyGoal !== "number") s.settings.dailyGoal = 4;
  var dd = d.settings.decay;
  s.settings.decay = s.settings.decay || {};
  if(typeof s.settings.decay.enabled !== "boolean") s.settings.decay.enabled = dd.enabled;
  if(typeof s.settings.decay.perDay !== "number") s.settings.decay.perDay = dd.perDay;
  if(typeof s.settings.decay.cap !== "number") s.settings.decay.cap = dd.cap;
  if(typeof s.settings.decay.floor !== "number") s.settings.decay.floor = dd.floor;
  return s;
}
function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw) return normalize(JSON.parse(raw));
  }catch(e){}
  return defaultState();
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast("⚠️ 本机存储不可用，请用「导出备份」保存"); }
}

/* ================= 计算 ================= */
function lvl(key){
  var s = SUBJECTS[key];
  var t = state.xp[key] / state.settings.xpMax[key];
  if(t < 0) t = 0; if(t > 1) t = 1;
  return s.maxLevel * Math.pow(t, state.settings.curveK);
}
function totalExact(){
  var sum = 0;
  SUBJECT_KEYS.forEach(function(k){ sum += lvl(k); });
  return sum;
}
function totalLvl(){ return Math.floor(totalExact()); }

function xpForLevel(key, targetLevel){
  var s = SUBJECTS[key];
  var t = targetLevel / s.maxLevel;
  if(t < 0) t = 0; if(t > 1) t = 1;
  return state.settings.xpMax[key] * Math.pow(t, 1/state.settings.curveK);
}
function xpNeededForLevel(key, targetLevel){
  var s = SUBJECTS[key];
  return Math.max(0, xpForLevel(key, targetLevel) - state.xp[key]);
}

function realmOf(level){
  if(level >= TOTAL_MAX) return { name:"登仙", stage:"大圆满" };
  var r = REALMS[0];
  REALMS.forEach(function(x){ if(level >= x.min) r = x; });
  var pos = level - r.min;
  var stage = pos < 12 ? "初期" : pos < 25 ? "中期" : pos < 37 ? "后期" : "圆满";
  return { name:r.name, stage:stage };
}

function dk(ts){ var d = new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function pad(n){ return String(n).length<2 ? "0"+n : ""+n; }
function todayKey(){ return dk(Date.now()); }
function addDaysKey(key, n){ var d = new Date(key + "T12:00:00"); d.setDate(d.getDate() + n); return dk(d.getTime()); }
function xpOn(key){ return state.log.filter(function(e){ return dk(e.ts) === key; }).reduce(function(a,e){ return a + e.xp; }, 0); }

function calcStreak(){
  var days = {};
  state.log.forEach(function(e){ days[dk(e.ts)] = true; });
  var cur = new Date(); cur.setHours(12,0,0,0);
  if(!days[dk(cur.getTime())]) cur.setDate(cur.getDate() - 1); // 今天还没学不算断签
  var n = 0;
  while(days[dk(cur.getTime())]){ n++; cur.setDate(cur.getDate() - 1); }
  return n;
}

function studiedMap(){
  var m = {};
  SUBJECT_KEYS.forEach(function(k){ m[k] = {}; });
  state.log.forEach(function(e){ if(m[e.subject]) m[e.subject][dk(e.ts)] = true; });
  return m;
}
function applyDecay(k, ticks){
  if(ticks <= 0) return 0;
  var L = lvl(k);
  var perDay = state.settings.decay.perDay;
  var floorLv = state.settings.decay.floor;
  var newL = L - perDay * ticks;
  if(newL < floorLv) newL = floorLv;
  if(newL >= L) return 0;
  state.xp[k] = xpForLevel(k, newL);
  return L - newL;
}
function runDecay(){
  var today = todayKey();
  var yesterday = addDaysKey(today, -1);
  var dr = state.decayRun;
  if(dr == null){ state.decayRun = yesterday; save(); return false; }
  if(dr >= yesterday) return false;
  var s = state.settings.decay;
  var start = addDaysKey(dr, 1);
  var stop = yesterday;
  if(!s.enabled){ state.decayRun = stop; save(); return false; }
  var studied = studiedMap();
  var cap = s.cap || 0;
  var msgs = [];
  SUBJECT_KEYS.forEach(function(k){
    var ticks = 0, d = start;
    while(d <= stop){
      if(!studied[k][d]) ticks++;
      if(cap > 0 && ticks >= cap) break;
      d = addDaysKey(d, 1);
    }
    var lost = applyDecay(k, ticks);
    if(lost > 0) msgs.push(SUBJECTS[k].name + " -" + fmt1(lost) + " 级");
  });
  state.decayRun = stop;
  if(msgs.length) state.lastDecay = { date: today, msgs: msgs };
  save();
  if(msgs.length){ toast("⚠️ 懈怠衰退：" + msgs.join("、")); return true; }
  return false;
}

/* ================= 格式化 ================= */
function fmt(n){ return String(Math.round(n*100)/100); }
function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }
function fmtXp(n){
  if(n >= 100) return String(Math.round(n));
  if(n >= 1) return String(Math.round(n*10)/10);
  return fmt(n);
}

/* ================= 渲染 ================= */
function render(){
  renderHero();
  renderSubjects();
  renderHistory();
  renderSettings();
}
function renderHero(){
  var exact = totalExact();
  var tl = totalLvl();
  var frac = Math.min(1, exact / TOTAL_MAX);
  var C = 2 * Math.PI * 88;
  var fg = document.getElementById("ringFg");
  fg.style.strokeDasharray = C;
  fg.style.strokeDashoffset = C * (1 - frac);

  var r = realmOf(tl);
  var realmLabel = (r.name === "登仙") ? r.name : r.name + "期";
  document.getElementById("realm").innerHTML = realmLabel + "<span class=\"stage\"> · " + r.stage + "</span>";
  document.getElementById("bigLevel").textContent = tl;
  document.getElementById("totalExact").textContent = fmt1(exact);
  document.getElementById("streakChip").textContent = "🔥 连续 " + calcStreak() + " 天";

  var today = xpOn(todayKey());
  var goal = state.settings.dailyGoal;
  document.getElementById("todayXp").textContent = fmtXp(today);
  document.getElementById("goalVal").textContent = fmtXp(goal);
  var done = today >= goal;
  document.getElementById("goalDone").textContent = done ? "已达标 ✓" : "未达标";
  document.getElementById("goalDone").className = done ? "done" : "";
  document.getElementById("goalBar").style.width = Math.min(100, today/goal*100) + "%";
}

function renderSubjects(){
  var html = "";
  SUBJECT_KEYS.forEach(function(k){
    var s = SUBJECTS[k];
    var lv = lvl(k);
    var pct = lv / s.maxLevel * 100;
    var acts = state.settings.activities[k] || [];
    html += '<div class="subj" style="--sc:' + s.color + '">'
      + '<div class="subj-head">'
      +   '<span class="subj-dot"></span>'
      +   '<span class="subj-name">' + s.name + '</span>'
      +   '<span class="subj-dao">' + s.dao + '</span>'
      +   '<span class="subj-score"><b>' + fmt1(lv) + '</b> / ' + s.maxLevel + '</span>'
      + '</div>'
      + '<div class="subj-bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>'
      + '<div class="chips">';
    acts.forEach(function(a){
      html += '<button class="chip" data-action="addXp" data-subject="' + k + '" data-xp="' + a.xp + '" data-label="' + esc(a.label) + '">'
            + esc(a.label) + '<span class="xp">+' + fmtXp(a.xp) + '</span></button>';
    });
    html += '<button class="chip custom" data-action="custom" data-subject="' + k + '">+ 自定义</button>';
    html += '</div></div>';
  });
  document.getElementById("subjects").innerHTML = html;
}

function esc(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderHistory(){
  var el = document.getElementById("historyList");
  if(!state.log.length){
    el.innerHTML = '<div class="empty"><div class="big">空空如也</div>从「修行」页点一下，开始积累你的第一笔经验。</div>';
    return;
  }
  var byDate = {};
  state.log.forEach(function(e){
    var key = dk(e.ts);
    (byDate[key] = byDate[key] || []).push(e);
  });
  var dates = Object.keys(byDate).sort(function(a,b){ return a < b ? 1 : -1; });
  var html = "";
  dates.forEach(function(key){
    var entries = byDate[key].slice().sort(function(a,b){ return b.ts - a.ts; });
    var total = entries.reduce(function(a,e){ return a + e.xp; }, 0);
    var d = new Date(key + "T12:00:00");
    var label = (d.getMonth()+1) + "月" + d.getDate() + "日";
    html += '<div class="day"><div class="day-head"><b>' + label + '</b><span class="day-total">共 +' + fmtXp(total) + ' 经验</span></div>';
    entries.forEach(function(e){
      var sc = (SUBJECTS[e.subject] || {color:"#999"}).color;
      html += '<div class="log-item"><span class="log-dot" style="--sc:' + sc + ';background:' + sc + '"></span>'
        + '<span class="log-label">' + esc(e.label || "") + '</span>'
        + '<span class="log-xp">+' + fmtXp(e.xp) + '</span>'
        + '<button class="log-del" data-action="delLog" data-id="' + e.id + '">✕</button></div>';
    });
    html += '</div>';
  });
  el.innerHTML = html;
}

function renderSettings(){
  document.getElementById("setGoal").value = state.settings.dailyGoal;
  document.getElementById("setCurve").value = state.settings.curveK;
  document.getElementById("curveVal").textContent = state.settings.curveK;

  var dc = state.settings.decay;
  document.getElementById("setDecayEnabled").checked = dc.enabled;
  document.getElementById("setDecayPerDay").value = dc.perDay;
  document.getElementById("setDecayCap").value = dc.cap;
  document.getElementById("setDecayFloor").value = dc.floor;
  document.getElementById("decayHint").innerHTML =
    "一天没练的科目会退级：每缺席一天退 <b style=\"color:var(--gold2)\">" + fmtXp(dc.perDay) + " 级</b>"
    + (dc.cap > 0 ? "，最多连续退 " + dc.cap + " 天" : "，无上限")
    + "，且不低于 " + fmtXp(dc.floor) + " 级的保留下限。"
    + (dc.enabled ? "" : "（当前已关闭）");
  var dl = state.lastDecay;
  document.getElementById("decayLast").innerHTML = dl
    ? ("最近衰退：" + dl.date + "　" + dl.msgs.join("、"))
    : "尚未发生过衰退。";

  var k = state.settings.curveK;
  var hint = "越接近 1 越接近线性；当前 " + k + "。";
  if(k <= 0.35) hint += " 前期极快、后期极难。";
  else if(k >= 0.8) hint += " 接近匀速升级。";
  else hint += " 前期升级快、后期慢。";
  document.getElementById("curveHint").textContent = hint;

  var m0 = xpForLevel("math", 10);
  var m1 = xpForLevel("math", 150) - xpForLevel("math", 140);
  document.getElementById("curveExample").innerHTML =
    "示例（数学）：前 10 级约需 <b style=\"color:var(--gold2)\">" + fmtXp(m0) + "</b> 经验，"
    + "最后 10 级（140→150）约需 <b style=\"color:var(--gold2)\">" + fmtXp(m1) + "</b> 经验。";

  var xmHtml = "";
  SUBJECT_KEYS.forEach(function(k){
    xmHtml += '<div class="field"><label>' + SUBJECTS[k].name + '（' + SUBJECTS[k].maxLevel + '级）</label>'
      + '<input type="number" data-role="xpmax" data-subject="' + k + '" step="10" min="10" value="' + state.settings.xpMax[k] + '"></div>';
  });
  document.getElementById("xpMaxFields").innerHTML = xmHtml;

  var actHtml = "";
  SUBJECT_KEYS.forEach(function(k){
    actHtml += '<div style="margin-top:10px"><div class="set-hint" style="margin-bottom:0;color:var(--muted)">' + SUBJECTS[k].name + '</div>';
    state.settings.activities[k].forEach(function(a, i){
      actHtml += '<div class="act-row">'
        + '<input class="act-label" data-role="act-label" data-subject="' + k + '" data-index="' + i + '" value="' + esc(a.label) + '">'
        + '<input class="act-xp" type="number" step="0.05" min="0.05" data-role="act-xp" data-subject="' + k + '" data-index="' + i + '" value="' + a.xp + '">'
        + '<button class="act-del" data-action="delAct" data-subject="' + k + '" data-index="' + i + '">✕</button></div>';
    });
    actHtml += '<button class="btn" data-action="addAct" data-subject="' + k + '">+ 新增活动</button></div>';
  });
  document.getElementById("actFields").innerHTML = actHtml;
}

/* ================= 交互 ================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function addXP(subject, xp, label){
  xp = Number(xp);
  if(!xp || xp <= 0){ toast("经验值需大于 0"); return; }
  var before = totalLvl();
  state.xp[subject] = (state.xp[subject] || 0) + xp;
  state.log.push({ id: uid(), ts: Date.now(), subject: subject, label: label || SUBJECTS[subject].name, xp: xp });
  save();
  render();
  var after = totalLvl();
  if(after > before){
    levelUp(before, after);
  } else {
    toast("+" + fmtXp(xp) + " " + SUBJECTS[subject].name + " · " + (label || ""));
  }
}

function levelUp(before, after){
  var rb = realmOf(before), ra = realmOf(after);
  var box = document.getElementById("levelup");
  document.getElementById("luEyebrow").textContent = (ra.name !== rb.name) ? "境界突破" : "等级提升";
  document.getElementById("luTitle").textContent = "Lv " + after;
  document.getElementById("luSub").textContent = (ra.name !== rb.name)
    ? ("晋入「" + ra.name + "期 · " + ra.stage + "」")
    : ("当前境界： " + ra.name + "期 · " + ra.stage);
  spawnParticles();
  box.classList.remove("show");
  void box.offsetWidth; // 重启动画
  box.classList.add("show");
  setTimeout(function(){ box.classList.remove("show"); }, 1750);
}

function spawnParticles(){
  var holder = document.querySelector("#levelup .box");
  holder.querySelectorAll(".particle").forEach(function(p){ p.remove(); });
  var n = 34;
  for(var i = 0; i < n; i++){
    var p = document.createElement("span");
    p.className = "particle";
    var ang = Math.random() * Math.PI * 2;
    var dist = 70 + Math.random() * 150;
    p.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(0) + "px");
    p.style.setProperty("--dy", (Math.sin(ang) * dist).toFixed(0) + "px");
    p.style.setProperty("--dur", (0.9 + Math.random() * 0.8).toFixed(2) + "s");
    p.style.left = "50%"; p.style.top = "50%";
    holder.appendChild(p);
  }
}

var toastTimer = null;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

function floatXp(x, y, text){
  var el = document.createElement("span");
  el.className = "float-xp";
  el.textContent = text;
  el.style.left = x + "px"; el.style.top = y + "px";
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 820);
}

function switchTab(tab){
  ["xiulian","history","settings"].forEach(function(t){
    document.getElementById("view-" + t).style.display = (t === tab) ? "block" : "none";
  });
  document.querySelectorAll("nav.tabbar button").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-tab") === tab);
  });
  window.scrollTo(0,0);
}

/* ================= 事件 ================= */
document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");

  if(action === "addXp"){
    var r = el.getBoundingClientRect();
    floatXp(r.left + r.width/2, r.top, "+" + fmtXp(el.getAttribute("data-xp")));
    addXP(el.getAttribute("data-subject"), el.getAttribute("data-xp"), el.getAttribute("data-label"));
  }
  else if(action === "custom"){
    openCustom(el.getAttribute("data-subject"));
  }
  else if(action === "tab"){
    switchTab(el.getAttribute("data-tab"));
  }
  else if(action === "delLog"){
    var id = el.getAttribute("data-id");
    state.log = state.log.filter(function(e){ return e.id !== id; });
    save(); render();
    toast("已删除该条记录");
  }
  else if(action === "export"){
    exportData();
  }
  else if(action === "import"){
    document.getElementById("importFile").click();
  }
  else if(action === "reset"){
    if(confirm("确定清空全部数据吗？此操作不可恢复，建议先「导出备份」。")){
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      state = defaultState();
      save(); render();
      toast("已重置，重新开始修行");
    }
  }
  else if(action === "addAct"){
    var k = el.getAttribute("data-subject");
    state.settings.activities[k].push({ label:"新活动", xp:0.5 });
    save(); renderSettings();
  }
  else if(action === "delAct"){
    var k = el.getAttribute("data-subject");
    var i = Number(el.getAttribute("data-index"));
    state.settings.activities[k].splice(i, 1);
    save(); renderSettings();
  }
});

document.addEventListener("change", function(ev){
  var el = ev.target;
  var role = el.getAttribute("data-role");
  if(el.id === "setGoal"){
    state.settings.dailyGoal = Math.max(0.5, Number(el.value) || 4);
    save(); renderHero();
  }
  else if(el.id === "setCurve"){
    state.settings.curveK = Number(el.value) || 0.5;
    document.getElementById("curveVal").textContent = state.settings.curveK;
    save(); render();
  }
  else if(el.id === "setDecayEnabled"){
    state.settings.decay.enabled = el.checked;
    save(); renderSettings();
  }
  else if(el.id === "setDecayPerDay"){
    state.settings.decay.perDay = Math.max(0.1, Number(el.value) || 1);
    save(); renderSettings();
  }
  else if(el.id === "setDecayCap"){
    state.settings.decay.cap = Math.max(0, Math.round(Number(el.value) || 0));
    save(); renderSettings();
  }
  else if(el.id === "setDecayFloor"){
    state.settings.decay.floor = Math.max(0, Number(el.value) || 0);
    save(); renderSettings();
  }
  else if(role === "xpmax"){
    var k = el.getAttribute("data-subject");
    state.settings.xpMax[k] = Math.max(10, Number(el.value) || 10);
    save(); render();
  }
  else if(role === "act-label" || role === "act-xp"){
    var k = el.getAttribute("data-subject");
    var i = Number(el.getAttribute("data-index"));
    var act = state.settings.activities[k][i];
    if(role === "act-label") act.label = el.value || "活动";
    else act.xp = Math.max(0.05, Number(el.value) || 0.05);
    save(); render();
  }
});

document.addEventListener("input", function(ev){
  var el = ev.target;
  if(el.id === "setCurve"){
    document.getElementById("curveVal").textContent = el.value;
  }
});

/* 自定义打卡弹窗 */
var customSubject = null;
function openCustom(k){
  customSubject = k;
  document.getElementById("customTitle").textContent = SUBJECTS[k].name + " · 自定义打卡";
  document.getElementById("customSub").textContent = "记录一次学习，折算为经验（" + SUBJECTS[k].name + "当前 " + fmt1(lvl(k)) + " / " + SUBJECTS[k].maxLevel + " 级）。";
  document.getElementById("customLabel").value = "";
  document.getElementById("customXp").value = "";
  var q = document.getElementById("customQuick");
  var opts = [0.1, 0.25, 0.5, 1];
  q.innerHTML = opts.map(function(o){ return '<button data-q="' + o + '">' + fmtXp(o) + '</button>'; }).join("");
  document.getElementById("customOverlay").classList.add("show");
}
document.getElementById("customQuick").addEventListener("click", function(ev){
  var b = ev.target.closest("[data-q]");
  if(b) document.getElementById("customXp").value = b.getAttribute("data-q");
});
document.getElementById("customOk").addEventListener("click", function(){
  var xp = Number(document.getElementById("customXp").value);
  var label = document.getElementById("customLabel").value.trim();
  if(!xp || xp <= 0){ toast("请输入大于 0 的经验值"); return; }
  addXP(customSubject, xp, label || SUBJECTS[customSubject].name);
  document.getElementById("customOverlay").classList.remove("show");
});
document.getElementById("customCancel").addEventListener("click", function(){
  document.getElementById("customOverlay").classList.remove("show");
});

/* 导入导出 */
function exportData(){
  var blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "考研修行数据-" + todayKey() + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("已导出备份文件");
}
document.getElementById("importFile").addEventListener("change", function(ev){
  var file = ev.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var s = normalize(JSON.parse(reader.result));
      state = s;
      save(); render();
      toast("导入成功 ✓");
    }catch(e){ toast("导入失败：文件格式不正确"); }
  };
  reader.readAsText(file);
  ev.target.value = "";
});

/* ================= 启动 ================= */
runDecay();
render();
setInterval(function(){ if(runDecay()) render(); }, 60000);
})();
</script>
</body>
